[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "silentbug"
version = "0.1.0"
description = "Find silent PyTorch training bugs: accidental broadcasting, parameters that never learn, and the line that caused them."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shushant Kumar Choudhary" }]
requires-python = ">=3.10"
dependencies = ["torch>=2.1"]
keywords = ["pytorch", "debugging", "broadcasting", "gradients", "training"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Debuggers",
]

[project.urls]
Homepage = "https://github.com/Shushant17711/silentbug"
Issues = "https://github.com/Shushant17711/silentbug/issues"
Changelog = "https://github.com/Shushant17711/silentbug/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
silentbug = "silentbug.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
